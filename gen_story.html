          {"archetype_id":"ARCH-21","archetype_name":"生命延續與心跳傳承 (Legacy Through Life-Giving)","core_formula":"一方生命終結 + 器官／血液延續他人生命 + 尋找與相認","representative_stories":["器官捐贈受贈者尋找家屬","聽見親人的心跳聲","骨髓捐贈配對重逢"],"story_structure":{"setup":"一個生命驟然殞落，家屬悲痛難以接受。","catalyst":"家屬選擇捐贈，讓部分生命以另一種形式延續。","climax":"受贈者與捐贈者家屬跨越時間找到彼此，或聽見那顆心臟仍在跳動。","resolution":"死亡不是終點，愛與生命以另一種方式延續下去。"}},
          {"archetype_id":"ARCH-22","archetype_name":"命中注定的巧合緣分 (Fated Coincidence)","core_formula":"表面陌生的兩人 + 命運早已悄悄牽連 + 巧合揭曉","representative_stories":["多年前救命恩人再相遇卻不自知","同一件物品串起兩代人","素未謀面卻互相幫過彼此家人"],"story_structure":{"setup":"兩個看似毫無關聯的人各自過著平凡生活。","catalyst":"因日常小事再度相遇或產生交集，渾然不知彼此的淵源。","climax":"一個細節、物件或對話揭露兩人早已被命運牽連多年。","resolution":"巧合讓兩人明白，善意與緣分一直在暗中循環。"}},
          {"archetype_id":"ARCH-23","archetype_name":"貴人提攜與翻身圓夢 (Sponsor & Breakthrough)","core_formula":"平凡人的潛力 + 陌生貴人給予機會 + 努力兌現夢想","representative_stories":["路邊攤主資助送報生念書","陌生顧客發掘街頭藝人","老闆願意賭一次給邊緣青年機會"],"story_structure":{"setup":"主角懷抱才華或夢想，卻困於資源匱乏或身分限制。","catalyst":"一位陌生人看見主角的潛力，主動給予一次機會。","climax":"主角把握機會，歷經努力克服現實考驗。","resolution":"主角靠自己的力量翻身圓夢，貴人在背後靜靜見證。"}},
          {"archetype_id":"ARCH-24","archetype_name":"瞞著至親獨自撐住 (Reverse Protective Illusion)","core_formula":"長輩／至親隱瞞病痛 + 獨自硬撐 + 子女意外發現真相","representative_stories":["父母生病卻報喜不報憂","獨居長輩隱瞞跌倒住院","家人瞞著在外遊子病情惡化"],"story_structure":{"setup":"至親身體出狀況，卻不願讓在外打拼的家人擔心。","catalyst":"通話中永遠報平安，實則獨自承受病痛與孤單。","climax":"子女因某個契機（意外來電、鄰居告知、返鄉探視）發現真相。","resolution":"子女趕回身邊，兩代人重新學會坦誠面對彼此的脆弱。"}}
        ],
        "emotional_elements_breakdown": {
          "dimensions": [
            {"element":"非對稱奉獻 (Asymmetric Sacrifice)","frequency_weight":0.16,"definition":"不求回報地耗損自己，成全他人。","key_triggers":["不可逆代價","最後託付","隱忍成全"]},
            {"element":"跨越隔閡 (Transcending Boundaries)","frequency_weight":0.14,"definition":"跨物種、階級、立場或生死建立連結。","key_triggers":["非功利信任","跨陣營相助","忘年之交"]},
            {"element":"體面與尊嚴守護 (Dignity Preservation)","frequency_weight":0.12,"definition":"幫助他人時留住其自尊。","key_triggers":["匿名加料","平等交換","守護秘密"]},
            {"element":"儀式感與時間長度 (Temporal Endurance)","frequency_weight":0.11,"definition":"長久重複的微小陪伴，累積成愛。","key_triggers":["每日守候","多年尋覓","固定問候"]},
            {"element":"溫柔假象與童真庇護 (Protective Illusion)","frequency_weight":0.10,"definition":"以想像力守護脆弱者的心。","key_triggers":["苦難變遊戲","畫出希望","圓夢"]},
            {"element":"時空回響與遺留信物 (Sensory & Temporal Anchors)","frequency_weight":0.09,"definition":"以物件、聲音與氣味跨越時間對話。","key_triggers":["預留信件","錄音帶","修補玩偶"]},
            {"element":"集體善意與微光共振 (Communal Resonance)","frequency_weight":0.08,"definition":"一個善念引發陌生人共同參與。","key_triggers":["全城開門","集體學習","規則讓位"]},
            {"element":"雙向治癒與破碎互補 (Mutual Healing)","frequency_weight":0.07,"definition":"破碎的雙方在照料中重獲勇氣。","key_triggers":["共同傷口","承擔責任","彼此照映"]},
            {"element":"接納殘缺與無條件包容 (Radical Acceptance)","frequency_weight":0.07,"definition":"不矯正差異，而是看見與理解。","key_triggers":["耐心傾聽","安全感","獨特價值"]},
            {"element":"本能記憶與超越衰退 (Instinctive Love Beyond Decay)","frequency_weight":0.06,"definition":"認知衰退時，愛仍作為本能留存。","key_triggers":["保留食物","熟悉旋律","緊握的花"]},
            {"element":"遲來理解與真相揭露 (Late Understanding)","frequency_weight":0.05,"definition":"以具體證據翻轉誤解，讓觀眾與主角同時理解。","key_triggers":["收據","未寄出的信","監視器畫面"]},
            {"element":"善意回流與希望延續 (Kindness Returned)","frequency_weight":0.05,"definition":"善意被接力或回到起點，形成正向閉環。","key_triggers":["傳遞幫助","意外回報","留下一個位置"]}
          ]
        }
      };

      let activeData = structuredClone(defaultData);
      let selectedAxes = {};
      let currentGeneratedPrompt = "";
      
      const $ = (id) => document.getElementById(id);
      const archetypeSelect = $("archetypeSelect");
      const elementSelect = $("elementSelect");
      const archetypeList = $("archetypeList");
      const elementsContainer = $("elementsContainer");
      const jsonEditor = $("jsonEditor");
      const promptPreview = $("promptPreview");
      const copyPromptBtn = $("copyPromptBtn");
      const copyBtnText = $("copyBtnText");
      const copyIcon = $("copyIcon");
      const axisLabels = { relationship: "關係", conflict: "衝突", twist: "反轉", ending: "結局" };

      function validateData(data) {
        if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("根節點必須是 JSON 物件。");
        if (!Array.isArray(data.narrative_archetypes)) throw new Error("缺少 narrative_archetypes 陣列。");
        if (!data.emotional_elements_breakdown || !Array.isArray(data.emotional_elements_breakdown.dimensions)) throw new Error("缺少 emotional_elements_breakdown.dimensions 陣列。");
        const defaultAxes = defaultData.narrative_axes;
        data.narrative_axes = data.narrative_axes || structuredClone(defaultAxes);
        ["relationship", "conflict", "twist", "ending"].forEach((axis) => {
          if (!Array.isArray(data.narrative_axes[axis]) || data.narrative_axes[axis].length === 0) data.narrative_axes[axis] = structuredClone(defaultAxes[axis]);
        });
        data.narrative_archetypes.forEach((item, index) => {
          if (!item.archetype_id || !item.archetype_name) throw new Error(`第 ${index + 1} 個原型必須包含 archetype_id 與 archetype_name。`);
        });
        data.dataset_summary = data.dataset_summary || {};
        data.dataset_summary.archetypes_count = data.narrative_archetypes.length;
        return data;
      }

      function makeOption(value, text) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = text;
        return option;
      }

      function renderUI() {
        const archetypes = activeData.narrative_archetypes;
        const dimensions = activeData.emotional_elements_breakdown.dimensions;
        selectedAxes = Object.fromEntries(Object.entries(activeData.narrative_axes).map(([key, values]) => [key, values[0]]));
        $("archetypeCount").textContent = archetypes.length;
        jsonEditor.value = JSON.stringify(activeData, null, 2);
        archetypeSelect.replaceChildren(...archetypes.map((item, index) => makeOption(index, `${item.archetype_id} — ${item.archetype_name}`)));
        elementSelect.replaceChildren(...dimensions.map((item, index) => makeOption(index, `${item.element} (${Math.round(item.frequency_weight * 100)}%)`)));

        archetypeList.replaceChildren(...archetypes.map((item) => {
          const card = document.createElement("article");
          card.className = "rounded-xl border border-slate-100 bg-slate-50/70 p-4 transition hover:border-indigo-200";
          const title = document.createElement("h4"); title.className = "mb-2 text-sm font-bold"; title.textContent = `${item.archetype_id} ${item.archetype_name}`;
          const formula = document.createElement("p"); formula.className = "mb-2 rounded bg-indigo-50/70 p-1.5 font-mono text-xs text-indigo-600"; formula.textContent = item.core_formula || "自訂核心公式";
          const examples = document.createElement("p"); examples.className = "text-xs text-slate-500"; examples.textContent = `代表案例：${(item.representative_stories || []).join("、") || "經典範例收錄中"}`;
          card.append(title, formula, examples); return card;
        }));

        elementsContainer.replaceChildren(...dimensions.map((dim) => {
          const percentage = Math.round((Number(dim.frequency_weight) || 0) * 100);
          const box = document.createElement("div"); box.className = "space-y-1";
          const top = document.createElement("div"); top.className = "flex justify-between text-xs font-medium";
          const label = document.createElement("span"); label.className = "text-slate-700"; label.textContent = dim.element;
          const value = document.createElement("span"); value.className = "font-mono text-slate-400"; value.textContent = `${percentage}%`;
          top.append(label, value);
          const track = document.createElement("div"); track.className = "h-2 w-full rounded-full bg-slate-100";
          const fill = document.createElement("div"); fill.className = "h-2 rounded-full bg-rose-500"; fill.style.width = `${Math.max(0, Math.min(100, percentage))}%`;
          const description = document.createElement("p"); description.className = "text-[11px] text-slate-400"; description.textContent = dim.definition || "";
          track.append(fill); box.append(top, track, description); return box;
        }));

        renderAxesUI();
        generateStoryOutline();
      }

      function renderAxesUI() {
        $("axesContainer").replaceChildren(...Object.entries(activeData.narrative_axes).map(([key, values]) => {
          const row = document.createElement("label"); row.className = "block text-xs";
          const label = document.createElement("span"); label.className = "mb-1 block font-bold text-sky-700"; label.textContent = axisLabels[key] || key;
          const select = document.createElement("select");
          select.className = "w-full rounded-lg border border-sky-200 bg-sky-50/60 p-2 text-xs text-slate-700 outline-none focus:ring-2 focus:ring-sky-400";
          select.dataset.axisKey = key;
          select.replaceChildren(...values.map((value) => makeOption(value, value)));
          select.value = selectedAxes[key] ?? values[0];
          select.addEventListener("change", () => {
            selectedAxes[key] = select.value;
            generateStoryOutline();
          });
          row.append(label, select); return row;
        }));
      }

      function stage(label, text) {
        const line = document.createElement("p");
        const strong = document.createElement("strong"); strong.className = "text-amber-800"; strong.textContent = label;
        line.append(strong, text); return line;
      }

      function buildAiPrompt(arch, element, axes, stages) {
        const triggers = (element?.key_triggers || []).join("、");
        return `請根據以下【敘事套路規格】與【敘事組合軸】，為我創作一篇約 45 秒短影音／精簡短篇動畫故事劇本（或溫馨敘事故事）。

【敘事原型】${arch.archetype_id} — ${arch.archetype_name}
【核心公式】${arch.core_formula || "無"}
【核心感人元素】${element?.element || "無"}（定義：${element?.definition || ""}；關鍵觸發點：${triggers || "真摯情感"}）

【敘事組合軸設定】
• 人物關係：${axes.relationship}
• 核心衝突：${axes.conflict}
• 情節反轉：${axes.twist}
• 故事結局：${axes.ending}

【四段式情節結構參考】
1. 起點（缺憾構建）：${stages.setup}
2. 契機（微光介入）：${stages.catalyst}
3. 高潮（代價與考驗）：${stages.climax}
4. 餘韻（情感共振）：${stages.resolution}

【創作要求】
1. 聚焦畫面感與情感細節，以具體動作、物件或細微表情呈現心理變化。
2. 節奏明快，高潮處的情感反轉需具備強烈的動人力量。
3. 輸出包含：【故事標題】、【角色設定】、【分段劇本（含畫面描述與旁白／對白）】、【一句話情緒餘韻】。`;
      }

      function generateStoryOutline() {
        const arch = activeData.narrative_archetypes[Number(archetypeSelect.value) || 0];
        const element = activeData.emotional_elements_breakdown.dimensions[Number(elementSelect.value) || 0];
        const axes = activeData.narrative_axes;
        if (!selectedAxes.relationship) selectedAxes = Object.fromEntries(Object.entries(axes).map(([key, values]) => [key, values[0]]));
        if (!arch) return;
        
        $("storyTitle").textContent = `《${arch.archetype_name}》×「${element?.element || "溫暖善意"}」核心故事骨幹`;
        $("storyFormula").textContent = `公式：${arch.core_formula || "自訂核心公式"}`;
        $("storyAxes").textContent = `組合軸：關係／${selectedAxes.relationship}　衝突／${selectedAxes.conflict}　反轉／${selectedAxes.twist}　結局／${selectedAxes.ending}`;
        
        const s = arch.story_structure || {};
        const stageData = {
          setup: s.setup || "主角身處困境或日常冷寂狀態中。",
          catalyst: s.catalyst || `引入契機，融入「${element?.element || "溫暖善意"}」。`,
          climax: s.climax || "善意在現實代價與時間限制中迎來考驗。",
          resolution: s.resolution || "留下溫暖而持久的情感餘韻。"
        };

        $("storyStages").replaceChildren(
          stage("1. 起點（缺憾構建）：", stageData.setup),
          stage("2. 契機（微光介入）：", stageData.catalyst),
          stage("3. 高潮（代價與考驗）：", stageData.climax),
          stage("4. 餘韻（情感共振）：", stageData.resolution)
        );

        // 生成 AI Prompt 並更新預覽框
        currentGeneratedPrompt = buildAiPrompt(arch, element, selectedAxes, stageData);
        promptPreview.value = currentGeneratedPrompt;
      }

      // 複製 AI Prompt 功能
      async function copyPrompt() {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(currentGeneratedPrompt);
          } else {
            promptPreview.select();
            document.execCommand("copy");
          }
          copyBtnText.textContent = "已複製！可貼給 AI";
          copyIcon.textContent = "✅";
          copyPromptBtn.classList.remove("bg-amber-600", "hover:bg-amber-700");
          copyPromptBtn.classList.add("bg-emerald-600", "hover:bg-emerald-700");
          
          setTimeout(() => {
            copyBtnText.textContent = "一鍵複製 AI Prompt";
            copyIcon.textContent = "📋";
            copyPromptBtn.classList.remove("bg-emerald-600", "hover:bg-emerald-700");
            copyPromptBtn.classList.add("bg-amber-600", "hover:bg-amber-700");
          }, 2000);
        } catch (err) {
          promptPreview.select();
          alert("複製失敗，請手動反白下方文字框並複製。");
        }
      }

      copyPromptBtn.addEventListener("click", copyPrompt);
      archetypeSelect.addEventListener("change", generateStoryOutline);
      elementSelect.addEventListener("change", generateStoryOutline);
      
      $("randomGenBtn").addEventListener("click", () => {
        archetypeSelect.value = Math.floor(Math.random() * activeData.narrative_archetypes.length);
        elementSelect.value = Math.floor(Math.random() * activeData.emotional_elements_breakdown.dimensions.length);
        const axes = activeData.narrative_axes;
        const pick = (list) => list[Math.floor(Math.random() * list.length)];
        selectedAxes = { relationship: pick(axes.relationship), conflict: pick(axes.conflict), twist: pick(axes.twist), ending: pick(axes.ending) };
        renderAxesUI();
        generateStoryOutline();
      });

      $("applyJsonBtn").addEventListener("click", () => {
        try { activeData = validateData(JSON.parse(jsonEditor.value)); renderUI(); }
        catch (error) { alert(`JSON 格式或資料結構錯誤：${error.message}`); }
      });

      $("resetBtn").addEventListener("click", () => { activeData = structuredClone(defaultData); renderUI(); });

      $("fileInput").addEventListener("change", (event) => {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = () => { try { activeData = validateData(JSON.parse(reader.result)); renderUI(); } catch (error) { alert(`無法匯入 JSON：${error.message}`); } };
        reader.readAsText(file, "utf-8"); event.target.value = "";
      });

      renderUI();
    </script>
  </body>
</html>
