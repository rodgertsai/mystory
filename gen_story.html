              key_triggers: [

            },
            {

              frequency_weight: 0.14,
              definition:
                "打破物種、階級、種族、立場或生死等天然壁壘，建立純粹無功利的靈魂連結。",
              key_triggers: [
                "動物對人類毫無保留的依賴",
                "敵對陣營在戰火中的短暫相擁",
                "跨階級的忘年之交",
              ],
            },
            {
              element: "體面與尊嚴守護 (Dignity Preservation)",
              frequency_weight: 0.12,
              definition:
                "在行善時極度克制施捨感，巧妙透過平等的交換或隱蔽的關懷，守住弱者最後的自尊。",
              key_triggers: [
                "暗中加料/免單而不張揚",
                "以微小勞務換取餐食的體面",
                "默契守護他人的窘迫秘密",
              ],
            },
            {
              element: "儀式感與時間長度 (Temporal Endurance)",
              frequency_weight: 0.11,
              definition:
                "以「數十年如一日」的極致時間跨度，將微小的習慣與陪伴昇華為不可撼動的精神信仰。",
              key_triggers: [

            },
            {

              definition:

              key_triggers: [

            {

              key_triggers: [

            {

              key_triggers: [
                "暴風雪中整座小鎮為滯留異鄉客打開家門",
                "全班為了一位聽障同學集體自學手語",
                "制度短暫停擺只為等候最後一人",
              ],
            },
            {
              element: "雙向治癒與破碎互補 (Mutual Healing)",
              frequency_weight: 0.07,
              definition:
                "兩個同樣被世界遺棄或身負創傷的殘缺主體，在彼此的笨拙照料中重新找到活下去的勇氣。",
              key_triggers: [
                "流浪街童與受傷小動物的相互依偎",
                "失意邊緣人在承擔保護責任時戰勝心魔",

            },

              frequency_weight: 0.07,
              definition:
                "不試圖去「矯正」對方的缺陷或怪異，而是給予最深層的看見、理解與安全感。",
              key_triggers: [
                "耐心傾聽四個小時怪異言論的小學校長",
                "擁抱自閉症孩童無法言說的情緒風暴",
                "因被深深愛過而真正獲得靈魂的破舊玩具",
              ],
            },
            {
              element: "本能記憶與超越衰退 (Instinctive Love Beyond Decay)",
              frequency_weight: 0.06,
              definition:
                "當理智、認知與生理機能被衰老或病痛徹底剝奪時，愛依然作為最底層的神經條件反射存留。",
              key_triggers: [
                "失智老人忘記一切卻仍緊緊護著給老伴的花",
                "認不出兒女的母親本能地把好吃的留給孩子",
                "在熟悉的琴聲與旋律響起時眼中瞬間重現神采",
              ],
            },
          ],
        },
      };

      let activeData = JSON.parse(JSON.stringify(defaultData));

      const archetypeSelect = document.getElementById("archetypeSelect");
      const elementSelect = document.getElementById("elementSelect");
      const archetypeList = document.getElementById("archetypeList");
      const elementsContainer = document.getElementById("elementsContainer");
      const jsonEditor = document.getElementById("jsonEditor");
      const archetypeCount = document.getElementById("archetypeCount");

      function renderUI() {
        const archetypes = activeData.narrative_archetypes || [];
        const dimensions =
          activeData.emotional_elements_breakdown?.dimensions || [];

        archetypeCount.textContent = archetypes.length;
        jsonEditor.value = JSON.stringify(activeData, null, 2);

        // 原型下拉選單
        archetypeSelect.innerHTML = "";
        archetypes.forEach((item, index) => {
          const opt = document.createElement("option");
          opt.value = index;
          opt.textContent = `${item.archetype_id} - ${item.archetype_name}`;
          archetypeSelect.appendChild(opt);
        });

        // 感人元素下拉選單
        elementSelect.innerHTML = "";
        if (dimensions.length > 0) {
          dimensions.forEach((item, index) => {
            const opt = document.createElement("option");
            opt.value = index;
            opt.textContent = `${item.element} (${Math.round((item.frequency_weight || 0.2) * 100)}%)`;
            elementSelect.appendChild(opt);
          });
        } else {
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "通用溫馨共振 (Default)";
          elementSelect.appendChild(opt);
        }

        // 渲染原型卡片庫
        archetypeList.innerHTML = "";
        archetypes.forEach((item) => {
          const card = document.createElement("div");
          card.className =
            "border border-slate-100 bg-slate-50/70 p-4 rounded-xl hover:border-indigo-200 transition";
          const sampleList = (
            item.representative_stories ||
            item.sample_stories ||
            []
          ).join("、");
          card.innerHTML = `
          <div class="flex items-center justify-between mb-1">
            <h4 class="font-bold text-slate-800 text-sm">${item.archetype_id} ${item.archetype_name}</h4>
          </div>
          <p class="text-xs font-mono text-indigo-600 bg-indigo-50/70 p-1.5 rounded mb-2">${item.core_formula || ""}</p>
          <p class="text-xs text-slate-500"><strong>代表案例：</strong>${sampleList || "經典範例收錄中"}</p>
        `;
          archetypeList.appendChild(card);
        });

        // 渲染感人維度進度條
        elementsContainer.innerHTML = "";
        if (dimensions.length > 0) {
          dimensions.forEach((dim) => {
            const percentage = Math.round((dim.frequency_weight || 0.2) * 100);
            const bar = document.createElement("div");
            bar.className = "space-y-1";
            bar.innerHTML = `
            <div class="flex justify-between text-xs font-medium">
              <span class="text-slate-700">${dim.element}</span>
              <span class="text-slate-400 font-mono">${percentage}%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-2">
              <div class="bg-rose-500 h-2 rounded-full" style="width: ${percentage}%"></div>
            </div>
            <p class="text-[11px] text-slate-400">${dim.definition || ""}</p>
          `;
            elementsContainer.appendChild(bar);
          });
        } else {
          elementsContainer.innerHTML = `<p class="text-xs text-slate-400 italic">當前 JSON 未定義維度分佈。</p>`;
        }

        generateStoryOutline();
      }

      function generateStoryOutline() {
        const archetypes = activeData.narrative_archetypes || [];
        const dimensions =
          activeData.emotional_elements_breakdown?.dimensions || [];

        const archIdx = archetypeSelect.value;
        const elemIdx = elementSelect.value;

        if (archetypes.length === 0 || archIdx === "") {
          document.getElementById("storyTitle").textContent = "無可用故事原型";
          document.getElementById("storyFormula").textContent = "";
          document.getElementById("storyStages").innerHTML = "";
          return;
        }

        const arch = archetypes[archIdx];
        const elem =
          dimensions.length > 0 && elemIdx !== ""
            ? dimensions[elemIdx]
            : { element: "溫暖善意" };

        document.getElementById("storyTitle").textContent =
          `《${arch.archetype_name}》×「${elem.element}」核心故事骨幹`;
        document.getElementById("storyFormula").textContent =
          `公式：${arch.core_formula || "自訂核心公式"}`;

        const struct = arch.story_structure || {
          setup: "主角身處特定困境或日常冷寂狀態中。",
          catalyst: `引入關鍵契機，並藉由【${elem.element}】建立深刻情感連結。`,
          climax: "面臨現實代價考驗或生死時間限制，善意迎來極致爆發。",
          resolution: "完成精神昇華，留下溫暖持久的情感餘韻。",
        };

        document.getElementById("storyStages").innerHTML = `
        <p><strong class="text-amber-800">1. 起點（缺憾構建）：</strong>${struct.setup}</p>
        <p><strong class="text-amber-800">2. 契機（微光介入）：</strong>${struct.catalyst.replace(/融入【.+】機制/, `融入【${elem.element}】機制`)}</p>
        <p><strong class="text-amber-800">3. 高潮（代價與考驗）：</strong>${struct.climax}</p>
        <p><strong class="text-amber-800">4. 餘韻（情感共振）：</strong>${struct.resolution}</p>
      `;
      }

      // 事件監聽
      archetypeSelect.addEventListener("change", generateStoryOutline);
      elementSelect.addEventListener("change", generateStoryOutline);

      document.getElementById("randomGenBtn").addEventListener("click", () => {
        const archetypes = activeData.narrative_archetypes || [];
        const dimensions =
          activeData.emotional_elements_breakdown?.dimensions || [];
        if (archetypes.length === 0) return;

        archetypeSelect.value = Math.floor(Math.random() * archetypes.length);
        if (dimensions.length > 0) {
          elementSelect.value = Math.floor(Math.random() * dimensions.length);
        }
        generateStoryOutline();
      });

      document.getElementById("applyJsonBtn").addEventListener("click", () => {
        try {
          const parsed = JSON.parse(jsonEditor.value);
          activeData = parsed;
          renderUI();
        } catch (err) {
          alert("JSON 格式解析錯誤：" + err.message);
        }
      });

      document.getElementById("resetBtn").addEventListener("click", () => {
        activeData = JSON.parse(JSON.stringify(defaultData));
        renderUI();
      });

      document.getElementById("fileInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            activeData = JSON.parse(event.target.result);
            renderUI();
          } catch (err) {
            alert("無法解析檔案內容為有效 JSON！");
          }
        };
        reader.readAsText(file);
      });

      // 啟動渲染
      renderUI();
    </script>
  </body>
</html>
